version: '3.8'

services:
  # Self-Hosted n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: devhub-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n

  # Activepieces: No-Code Automation Tool
  activepieces:
    image: activepieces/activepieces:latest
    container_name: devhub-activepieces
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      - AP_ENVIRONMENT=prod
      - AP_ENCRYPTION_KEY=devhub_insecure_key_change_me_32char
      - AP_JWT_SECRET=devhub_jwt_secret_token_activepieces
      - AP_FRONTEND_URL=http://localhost:8084
    volumes:
      - activepieces_data:/root/.activepieces

  # Apache Airflow: Scheduled Python Directed Acyclic Graph (DAG) Pipelines
  airflow-webserver:
    image: apache/airflow:2.8.3-python3.11
    container_name: devhub-airflow-web
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=devhub_airflow_secret_key
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --password admin --firstname Dev --lastname Hub --role Admin --email admin@devhub.local || true &&
               airflow webserver"
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

  airflow-scheduler:
    image: apache/airflow:2.8.3-python3.11
    container_name: devhub-airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    command: airflow scheduler
    volumes:
      - airflow_dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

volumes:
  n8n_data:
  activepieces_data:
  airflow_dags:
  airflow_logs:

networks:
  default:
    name: universal-dev-network
