# ==============================================================================
# UNIFORGE AI Workbench + Control Plane — Production Stack
# ==============================================================================
name: uniforge-workbench-production

services:
  uniforge-control-plane:
    build:
      context: ../..
      dockerfile: 00-universal-control-plane/orchestrator-api/Dockerfile
    container_name: uniforge-control-plane
    ports:
      - "7000:7000"
    environment:
      CONTROL_PLANE_PORT: "7000"
      UNIFORGE_ENV: production
    restart: unless-stopped
    networks:
      - uniforge-prod-net

  uniforge-workbench:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: uniforge-workbench
    ports:
      - "5173:5173"
    depends_on:
      - uniforge-control-plane
    restart: unless-stopped
    networks:
      - uniforge-prod-net

networks:
  uniforge-prod-net:
    driver: bridge

