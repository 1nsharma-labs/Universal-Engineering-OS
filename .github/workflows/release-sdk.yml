name: Release @uniforge/plugin-sdk to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm release tag (latest, beta, next)'
        required: true
        default: 'latest'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build Package
        run: |
          cd packages/plugin-sdk
          npm ci || npm install
          npm run build
          npm test || true

      - name: Publish to npm
        run: |
          cd packages/plugin-sdk
          npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

