version: '3.8'

services:
  # Relational DB with Vector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devhub-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhub_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devhub_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db/01-init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhub -d devhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Relational Database: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: devhub-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devhub_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devhub_db}
      MYSQL_USER: ${MYSQL_USER:-devhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devhub_pass}
    volumes:
      - mysql_data:/var/lib/mysql

  # Document Store: MongoDB 7.0
  mongodb:
    image: mongo:7.0
    container_name: devhub-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-devhub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-devhub_mongo_pass}
    volumes:
      - mongo_data:/data/db

  # In-Memory Cache & Message Broker: Redis 7.2
  redis:
    image: redis:7.2-alpine
    container_name: devhub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devhub_redis_pass}
    volumes:
      - redis_data:/data

  # Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: devhub-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Milvus Metadata Store (etcd) - Activated with `--profile milvus`
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: devhub-milvus-etcd
    profiles: ["milvus"]
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  # Vector Database: Milvus Standalone - Activated with `--profile milvus`
  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: devhub-milvus
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-devhub_admin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-devhub_minio_secret}
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  # Message Broker: RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: devhub-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-devhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-devhub_rabbit_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Event Streaming: Apache Kafka (KRaft Mode)
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: devhub-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # S3-Compatible Object Storage: MinIO
  minio:
    image: minio/minio:RELEASE.2024-03-26T22-10-45Z
    container_name: devhub-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devhub_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devhub_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  mysql_data:
  mongo_data:
  redis_data:
  qdrant_data:
  etcd_data:
  milvus_data:
  rabbitmq_data:
  minio_data:

networks:
  default:
    name: universal-dev-network
