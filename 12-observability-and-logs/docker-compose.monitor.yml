version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: devhub-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.4.1
    container_name: devhub-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: devhub-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: devhub-langfuse
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://devhub:devhub_secure_pass@postgres:5432/devhub_db
      - NEXTAUTH_SECRET=devhub_langfuse_secret_32_characters_long
      - NEXTAUTH_URL=http://localhost:3002
      - TELEMETRY_ENABLED=false

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: universal-dev-network
