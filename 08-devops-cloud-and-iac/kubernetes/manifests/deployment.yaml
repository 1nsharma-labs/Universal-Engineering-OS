apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-app
  labels:
    app: universal-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-app
  template:
    metadata:
      labels:
        app: universal-app
    spec:
      containers:
        - name: app
          image: universal-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: universal-app-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: universal-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: universal-app-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: app.devhub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: universal-app-svc
                port:
                  number: 80
