apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: uniforge-tenant-isolation
spec:
  podSelector:
    matchLabels:
      uniforge.io/role: tenant-workspace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: control-plane
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

